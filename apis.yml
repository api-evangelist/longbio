name: LongBio Pharma
description: LongBio Pharma (Suzhou/Shanghai, founded 2020) is a Chinese clinical-stage
  biopharmaceutical company focused on the in-house discovery and development of innovative
  antibody and fusion-protein therapeutics for allergic, autoimmune, and complement-mediated
  diseases. Its lead programs include the anti-IgE antibody LP-003 for chronic spontaneous
  urticaria and asthma. Co-founded by Dr. Bill Nai-chau Sun (co-founder of Tanox and
  co-inventor of Omalizumab/Xolair), LongBio raised a Series B2 round led by Qiming
  Venture Partners and listed on the Hong Kong Stock Exchange (01779.HK) in June 2026.
  It is a pharmaceutical drug developer with no public developer or API surface; this
  profile was surfaced as a Qiming portfolio company and completed an enrichment pass.
